<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Começando em breve</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<!--
  ================================================================
   TELA DE INICIO DE LIVE  -  contagem regressiva (OBS, 1920 x 1080)
  ================================================================
   NO OBS
     Fontes -> + -> Navegador -> URL desta pagina (ou "Arquivo local")
     Largura 1920, Altura 1080.
     Marque "Atualizar o navegador quando a cena ficar ativa":
     assim a contagem recomeca toda vez que voce entra na cena.

   TEMPO
     Padrao: 10 minutos (CONFIG.minutos). Pra mudar sem editar o
     arquivo, use o link com ?min=   ->   inicio.html?min=5

   VISUAL
     Cristais, petalas, notinhas musicais e brilhos, com a splash art
     da Seraphine do lado direito (vem do Data Dragon, CDN da Riot).
     Escolha a skin pelo numero da lista (1 a 14), em CONFIG.skin
     ou pelo link: inicio.html?skin=8   (junta com o tempo: ?min=5&skin=8)
        1  Classica
        2  K/DA ALL OUT - Indie
        3  K/DA ALL OUT - Rumo ao Estrelato
        4  K/DA ALL OUT - Superstar
        5  Fenix Graciosa
        6  Cancao do Oceano
        7  Cancao do Oceano de Prestigio
        8  Corte das Fadas
        9  Guardia Estelar
       10  Ave de Batalha
       11  Meili Cafe
       12  Fogos de Artificio
       13  T1
       14  Hino ao Amor   <- padrao
     Quer usar uma imagem sua? Coloque o link dela em CONFIG.imagem.
     Nao quer imagem? CONFIG.arte = false (o cartao volta pro meio).
  ================================================================
-->
<script>
const CONFIG = {
  nome: "bombombia",
  minutos: 10,                               // duração da contagem (ou use ?min=5 no link)
  rotulo: "a live já vai começar",           // texto em cima do relógio
  rotuloFinal: "começando! 💖",              // quando chega em 00:00
  campea: "Seraphine · Rosa de Cristal",     // linha embaixo do nome
  rodape: "pega uma aguinha e já volto 💖",   // frase lá embaixo ("" = esconde)

  arte: true,                                // Seraphine do lado direito (false = só o cartão, no meio)
  skin: 14,                                  // número da lista lá em cima (1 a 14) · 14 = Hino ao Amor
  imagem: "",                                // link de outra imagem (se preencher, ignora a skin)
  foco: "60% 30%",                           // qual parte da arte fica em destaque (x% y%)
  deslocar: 340,                             // empurra a arte pra direita (px), pra sobrar espaço pro cartão
  credito: "arte: Riot Games",               // textinho no canto ("" = esconde)

  redes: [
    { rede: "twitch",    texto: "twitch.tv/bombombia" },
    { rede: "instagram", texto: "@_pereirabiaa" },
    { rede: "x",         texto: "@bombombiaa" },
    { rede: "tiktok",    texto: "@bombombia" },
  ],

  cores: {
    rosa:      "#ff5fa8",
    rosaClaro: "#ffb3d6",
    lilas:     "#b57bff",
    pessego:   "#ffb28a",
    fundo1:    "#3b0a2f",   // gradiente do fundo (de cima pra baixo)
    fundo2:    "#7a1758",
    fundo3:    "#2c0b3a",
  },

  cristais: 10, petalas: 14, notas: 10, brilhos: 40,
  laco: true,
};
</script>

<style>
  :root { --rosa:#ff5fa8; --rosa-claro:#ffb3d6; --lilas:#b57bff; --pessego:#ffb28a; --fundo1:#3b0a2f; --fundo2:#7a1758; --fundo3:#2c0b3a; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--fundo1); color:#fff; font-family:'Quicksand','Segoe UI',Arial,sans-serif; }
  .palco { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; }
  .fundo { position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 12% 12%, rgba(255,95,168,.45), transparent 55%),
      radial-gradient(ellipse at 88% 88%, rgba(181,123,255,.40), transparent 55%),
      radial-gradient(ellipse at 50% 55%, rgba(255,179,214,.14), transparent 60%),
      linear-gradient(160deg, var(--fundo1) 0%, var(--fundo2) 50%, var(--fundo3) 100%); }
  .bokeh, .particulas { position:absolute; inset:0; overflow:hidden; pointer-events:none; }

  /* ---------- a arte (só quando CONFIG.arte = true) ---------- */
  .arte { position:absolute; top:0; bottom:0; left:var(--arte-x); right:-160px; overflow:hidden; -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 30%); mask-image:linear-gradient(90deg, transparent 0, #000 30%); }
  .arte img { width:100%; height:100%; object-fit:cover; object-position:var(--foco); transform-origin:var(--foco); animation:respirar 40s ease-in-out infinite alternate; }
  .veu { position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(59,10,47,.97) 0%, rgba(59,10,47,.92) 22%, rgba(59,10,47,.55) 45%, rgba(59,10,47,.10) 68%, rgba(59,10,47,0) 100%),
      linear-gradient(0deg, rgba(30,5,30,.75) 0%, rgba(30,5,30,0) 30%),
      linear-gradient(180deg, rgba(30,5,30,.45) 0%, rgba(30,5,30,0) 22%); }
  .arte, .veu, .credito { display:none; }
  body.com-arte .arte, body.com-arte .veu { display:block; }
  body.com-arte .credito { display:block; position:absolute; right:52px; bottom:44px; z-index:3; font-size:15px; font-weight:700; letter-spacing:.5px; color:rgba(255,255,255,.45); }
  body.com-arte .centro { justify-content:flex-start; padding-left:150px; }
  body.com-arte .cartao { width:780px; padding:34px 44px 40px; }
  body.com-arte .rodape { left:150px; right:auto; width:780px; }
  .bokeh span { position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 70%); animation:flutuar var(--dur) ease-in-out var(--delay) infinite alternate; }

  /* ---------- partículas ---------- */
  .cristal { position:absolute; width:var(--tam); height:calc(var(--tam) * 1.33); transform:rotate(var(--rot)); opacity:.92; filter:drop-shadow(0 0 12px rgba(255,150,200,.65)); }
  .cristal svg { display:block; width:100%; height:100%; animation:flutuar var(--dur) ease-in-out var(--delay) infinite alternate; }
  .petala { position:absolute; top:-70px; width:var(--tam); height:var(--tam); animation:cair var(--dur) linear var(--delay) infinite; }
  .petala i { display:block; width:100%; height:100%; animation:girar 3s ease-in-out infinite alternate; }
  .petala svg { display:block; width:100%; height:100%; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
  .nota { position:absolute; bottom:-80px; font-size:var(--tam); line-height:1; color:rgba(255,255,255,.8); text-shadow:0 0 14px var(--rosa); animation:subirNota var(--dur) linear var(--delay) infinite; }
  .brilhinho { position:absolute; width:var(--tam); height:var(--tam); margin:calc(var(--tam) / -2) 0 0 calc(var(--tam) / -2); animation:piscar var(--dur) ease-in-out var(--delay) infinite; }
  .brilhinho svg { display:block; width:100%; height:100%; fill:#fff; filter:drop-shadow(0 0 5px var(--cor)); }

  /* ---------- moldura em volta da tela ---------- */
  .moldura { position:absolute; inset:26px; z-index:2; pointer-events:none; }
  .moldura .anel { position:absolute; left:0; top:0; display:block; overflow:visible; }
  .moldura .canto { position:absolute; width:40px; height:40px; fill:var(--rosa); stroke:#fff; stroke-width:1.5px; filter:drop-shadow(0 0 8px var(--rosa)); animation:pulsar 2.2s ease-in-out infinite; }
  .laco { position:absolute; left:50%; margin-left:-90px; top:-38px; width:180px; height:101px; transform-origin:50% 45%; animation:balancinho 4s ease-in-out infinite; filter:drop-shadow(0 4px 8px rgba(0,0,0,.28)); }

  /* ---------- cartão central ---------- */
  .centro { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; }
  .cartao {
    width:1080px; padding:38px 56px 42px; border-radius:52px; text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.06));
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:2px solid rgba(255,255,255,.30);
    box-shadow:0 30px 80px rgba(0,0,0,.35), 0 0 70px rgba(255,95,168,.28), inset 0 1px 0 rgba(255,255,255,.4);
    animation:boiar 4.5s ease-in-out infinite alternate;
  }
  .rotulo { display:inline-flex; align-items:center; gap:10px; padding:9px 22px 9px 16px; border-radius:999px; background:linear-gradient(95deg, var(--rosa), var(--lilas)); font-weight:700; font-size:18px; letter-spacing:2.5px; text-transform:uppercase; box-shadow:0 6px 18px rgba(0,0,0,.25), 0 0 16px rgba(255,95,168,.5), inset 0 1px 0 rgba(255,255,255,.5); }
  .rotulo i { width:12px; height:12px; border-radius:50%; background:#fff; animation:ping 1.4s ease-out infinite; }
  .relogio { position:relative; width:360px; height:360px; margin:24px auto 8px; }
  .anel-tempo { position:absolute; inset:0; transform:rotate(-90deg); overflow:visible; }
  .trilho { fill:none; stroke:rgba(255,255,255,.14); stroke-width:14; }
  .progresso { fill:none; stroke:url(#gTempo); stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset 1s linear; filter:drop-shadow(0 0 8px rgba(255,95,168,.8)); }
  .tempo { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Fredoka','Quicksand',sans-serif; font-weight:600; font-size:112px; letter-spacing:2px; font-variant-numeric:tabular-nums; text-shadow:0 0 26px rgba(255,95,168,.75), 0 4px 10px rgba(0,0,0,.3); }
  .nome { font-family:'Pacifico','Segoe Script',cursive; font-size:78px; line-height:1.25; background:linear-gradient(95deg, #fff 0%, var(--rosa-claro) 45%, var(--rosa) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 14px rgba(255,95,168,.55)); }
  .campea { font-size:24px; font-weight:700; letter-spacing:1px; color:rgba(255,255,255,.88); }
  .campea b { color:var(--rosa-claro); margin:0 10px; }
  .redes { display:flex; justify-content:center; flex-wrap:wrap; gap:14px; margin-top:26px; }
  .rede { display:inline-flex; align-items:center; gap:9px; padding:6px 18px 6px 7px; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); font-weight:700; font-size:19px; box-shadow:0 4px 14px rgba(0,0,0,.18); }
  .rede i { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, var(--rosa), var(--lilas)); box-shadow:0 0 10px rgba(255,95,168,.5); }
  .rede svg { width:18px; height:18px; fill:#fff; }
  .rodape { position:absolute; left:0; right:0; bottom:58px; z-index:3; text-align:center; font-size:26px; font-weight:700; color:rgba(255,255,255,.85); text-shadow:0 2px 12px rgba(0,0,0,.35); }

  /* quando chega em 00:00 */
  body.fim .tempo { animation:pulsar 1s ease-in-out infinite; }
  body.fim .rotulo { animation:pulsar 1.2s ease-in-out infinite; }

  /* ---------- animações ---------- */
  @keyframes respirar   { from { transform:scale(1) } to { transform:scale(1.07) } }
  @keyframes flutuar    { from { transform:translateY(-16px) rotate(-7deg) } to { transform:translateY(16px) rotate(7deg) } }
  @keyframes cair       { 0% { transform:translate(0,0); opacity:0 } 8% { opacity:.95 } 90% { opacity:.95 } 100% { transform:translate(var(--desvio), 1220px); opacity:0 } }
  @keyframes girar      { from { transform:rotate(-45deg) } to { transform:rotate(45deg) } }
  @keyframes subirNota  { 0% { transform:translateY(0) rotate(-10deg); opacity:0 } 10% { opacity:.85 } 85% { opacity:.85 } 100% { transform:translateY(-1000px) rotate(10deg); opacity:0 } }
  @keyframes piscar     { 0%,100% { transform:scale(0) rotate(0deg); opacity:0 } 50% { transform:scale(1) rotate(90deg); opacity:1 } }
  @keyframes pulsar     { 0%,100% { transform:rotate(var(--rot,0deg)) scale(1) } 50% { transform:rotate(var(--rot,0deg)) scale(1.12) } }
  @keyframes boiar      { from { transform:translateY(-7px) } to { transform:translateY(7px) } }
  @keyframes balancinho { 0%,100% { transform:rotate(-4deg) } 50% { transform:rotate(4deg) } }
  @keyframes ping       { 0% { box-shadow:0 0 0 0 rgba(255,255,255,.8) } 100% { box-shadow:0 0 0 10px rgba(255,255,255,0) } }
</style>
</head>
<body>

  <defs>

    <linearGradient id="gPetala" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa6d2"/><stop offset="1" stop-color="#ff4d9d"/></linearGradient>

<div class="palco">
  <div class="fundo"></div>

  <div class="credito"></div>

<script>
(function () {
  const C = CONFIG, W = 1920, H = 1080;
  const palco = document.querySelector('.palco');
  const root = document.documentElement.style;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const escolhe = arr => arr[Math.floor(Math.random() * arr.length)];
  for (const k in C.cores) root.setProperty('--' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase()), C.cores[k]);

  // encaixa o palco 1920x1080 no tamanho da janela / da fonte no OBS
  function ajustar() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    palco.style.transform = 'translate(' + (innerWidth - W * s) / 2 + 'px,' + (innerHeight - H * s) / 2 + 'px) scale(' + s + ')';
  }
  addEventListener('resize', ajustar); ajustar();
  const params = new URLSearchParams(location.search);

  // a arte: imagem própria, ou a splash da skin (?skin=8 no link troca)
  if (C.arte) {
    document.body.classList.add('com-arte');
    const SKINS = [0, 1, 2, 3, 4, 14, 15, 24, 34, 43, 50, 59, 68, 69];   // lista 1..14 -> número que a Riot usa
    const pedida = parseInt(params.get('skin'), 10);
    const n = pedida >= 1 && pedida <= SKINS.length ? pedida : C.skin;
    const img = document.querySelector('.arte img');
    img.src = C.imagem || 'https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Seraphine_' + (SKINS[n - 1] ?? 69) + '.jpg';
    img.style.setProperty('--foco', C.foco);
    document.querySelector('.arte').style.setProperty('--arte-x', C.deslocar + 'px');
    document.querySelector('.credito').textContent = C.credito || '';
  }

  // textos
  document.querySelector('.rotulo span').textContent = C.rotulo;
  document.querySelector('.nome').textContent = C.nome;
  document.querySelector('.campea span').textContent = C.campea;
  const rodape = document.querySelector('.rodape');
  if (C.rodape) rodape.textContent = C.rodape; else rodape.remove();
  const redes = document.querySelector('.redes');
  C.redes.forEach(r => {
    const a = document.createElement('div');
    a.className = 'rede';
    a.innerHTML = '<i><svg viewBox="0 0 24 24"><use href="#ic-' + r.rede + '"/></svg></i><span></span>';
    a.querySelector('span').textContent = r.texto;
    redes.appendChild(a);
  });

  // moldura em volta da tela: anel com gradiente girando + corações nos cantos + lacinho
  const mold = document.querySelector('.moldura'), ml = W - 52, ma = H - 52, mr = 40;
  mold.innerHTML =
    '<svg class="anel" width="' + ml + '" height="' + ma + '" viewBox="0 0 ' + ml + ' ' + ma + '">' +
      '<defs><linearGradient id="gMold" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="' + C.cores.rosa + '"/><stop offset=".45" stop-color="' + C.cores.lilas + '"/><stop offset="1" stop-color="' + C.cores.pessego + '"/>' +
        '<animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="12s" repeatCount="indefinite"/>' +
      '</linearGradient></defs>' +
      '<rect x="3" y="3" width="' + (ml - 6) + '" height="' + (ma - 6) + '" rx="' + mr + '" fill="none" stroke="url(#gMold)" stroke-width="6"/>' +
      '<rect x="11" y="11" width="' + (ml - 22) + '" height="' + (ma - 22) + '" rx="' + (mr - 8) + '" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.5"/>' +
    '</svg>' +
    [['left:-8px;top:-8px', '-20deg'], ['right:-8px;top:-8px', '20deg'], ['left:-8px;bottom:-8px', '20deg'], ['right:-8px;bottom:-8px', '-20deg']]
      .map(p => '<svg class="canto" style="' + p[0] + ';--rot:' + p[1] + '" viewBox="0 0 24 24"><use href="#ic-coracao"/></svg>').join('') +
    (C.laco ? document.getElementById('laco-modelo').innerHTML : '');

  // bolinhas de luz desfocadas no fundo
  const bokeh = document.querySelector('.bokeh');
  for (let k = 0; k < 10; k++) {
    const s = document.createElement('span'), t = rnd(140, 360);
    s.style.cssText = 'left:' + rnd(-100, W) + 'px;top:' + rnd(-100, H) + 'px;width:' + t + 'px;height:' + t + 'px;opacity:' + rnd(.25, .5) + ';--dur:' + rnd(6, 12) + 's;--delay:-' + rnd(0, 12) + 's';
    bokeh.appendChild(s);
  }

  // partículas
  const P = document.querySelector('.particulas');
  const cores = [C.cores.rosa, C.cores.rosaClaro, C.cores.lilas, C.cores.pessego, '#ffffff'];
  const lateral = C.arte                                                        // fora do cartão (e da Seraphine)
    ? () => Math.random() < .6 ? rnd(940, 1090) : rnd(1780, 1870)
    : () => Math.random() < .5 ? rnd(60, 380) : rnd(1540, 1860);

  for (let k = 0; k < C.cristais; k++) {                                        // cristais flutuando
    const d = document.createElement('div');
    d.className = 'cristal';
    d.style.cssText = 'left:' + lateral() + 'px;top:' + rnd(80, 940) + 'px;--tam:' + rnd(34, 90) + 'px;--rot:' + rnd(-30, 30) + 'deg;--dur:' + rnd(4, 8) + 's;--delay:-' + rnd(0, 8) + 's';
    d.innerHTML = '<svg viewBox="0 0 24 32"><use href="#ic-cristal"/></svg>';
    P.appendChild(d);
  }
  for (let k = 0; k < C.petalas; k++) {                                         // pétalas caindo
    const d = document.createElement('div'), dur = rnd(9, 16);
    d.className = 'petala';
    d.style.cssText = 'left:' + rnd(0, W) + 'px;--tam:' + rnd(18, 40) + 'px;--dur:' + dur + 's;--delay:-' + rnd(0, dur) + 's;--desvio:' + rnd(-160, 160) + 'px';
    d.innerHTML = '<i style="animation-duration:' + rnd(2, 4) + 's"><svg viewBox="0 0 24 24"><use href="#ic-petala"/></svg></i>';
    P.appendChild(d);
  }
  const glifos = ['♪', '♫', '♬', '♩'];
  for (let k = 0; k < C.notas; k++) {                                           // notinhas subindo
    const d = document.createElement('div'), dur = rnd(8, 14);
    d.className = 'nota';
    d.style.cssText = 'left:' + lateral() + 'px;--tam:' + rnd(28, 60) + 'px;--dur:' + dur + 's;--delay:-' + rnd(0, dur) + 's';
    d.textContent = escolhe(glifos);
    P.appendChild(d);
  }
  for (let k = 0; k < C.brilhos; k++) {                                         // brilhinhos
    const d = document.createElement('div'), dur = rnd(1.8, 4);
    d.className = 'brilhinho';
    d.style.cssText = 'left:' + rnd(20, W - 20) + 'px;top:' + rnd(20, H - 20) + 'px;--tam:' + rnd(10, 28) + 'px;--cor:' + escolhe(cores) + ';--dur:' + dur + 's;--delay:-' + rnd(0, dur) + 's';
    d.innerHTML = '<svg viewBox="0 0 24 24"><use href="#ic-brilho"/></svg>';
    P.appendChild(d);
  }

  // contagem regressiva (?min=5 no link muda a duração)
  const pMin = parseFloat(params.get('min'));
  const minutos = pMin > 0 ? pMin : C.minutos;
  const total = Math.round(minutos * 60) * 1000, fim = Date.now() + total;
  const tempo = document.querySelector('.tempo'), prog = document.querySelector('.progresso'), rotulo = document.querySelector('.rotulo span');
  const CIRC = 2 * Math.PI * 155;
  prog.style.strokeDasharray = CIRC;
  const dois = n => String(n).padStart(2, '0');
  let timer;
  function tick() {
    const resta = Math.max(0, fim - Date.now()), s = Math.ceil(resta / 1000);
    tempo.textContent = dois(Math.floor(s / 60)) + ':' + dois(s % 60);
    prog.style.strokeDashoffset = CIRC * (1 - resta / total);
    if (resta <= 0) {
      clearInterval(timer);
      document.body.classList.add('fim');
      rotulo.textContent = C.rotuloFinal;
      prog.style.strokeDashoffset = 0;          // anel volta a ficar cheio, brilhando
    }
  }
  tick();
  timer = setInterval(tick, 250);
})();
</script>
</body>
</html>
